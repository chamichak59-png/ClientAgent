name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Create minimal build.gradle
      run: |
        echo "plugins { id 'com.android.application' version '8.1.1' apply false }" > build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" > settings.gradle
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.clientagent'
            compileSdk 34
            defaultConfig {
                applicationId 'com.example.clientagent'
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
